<!doctype html>
<!--
  Source of the app icon: the spherical audio-wave visualizer (SphereWave.svelte)
  on the app's dark glass background, in the macOS icon grid (824 px body on a
  1024 px canvas). Render to icon.png, then run `pnpm tauri icon icon/icon.png`.
  See icon/README.md.
-->
<html>
  <body style="margin: 0; background: transparent">
    <canvas id="c" width="1024" height="1024"></canvas>
    <script>
      const c = document.getElementById("c");
      const ctx = c.getContext("2d");
      const S = 1024;
      const M = 100; // margin: macOS icon body is 824 px
      const B = S - 2 * M;
      const RAD = 185;

      // Palettes (pick with ?p=name in the URL). Each: body gradient, glow, ring
      // stops from the top of the sphere to the bottom, core highlight.
      const PALETTES = {
        current: {
          body: ["#26314f", "#111729", "#1d1840"], shadow: "#0b1020",
          glow: ["rgba(110,170,255,0.42)", "rgba(140,120,255,0.12)", "rgba(140,120,255,0)"],
          rings: [[0, [96, 205, 255]], [0.38, [150, 185, 255]], [0.7, [178, 140, 255]], [1, [255, 140, 110]]],
          core: "200,220,255",
        },
        // Ink and paper: near-black blue body, cream rings, one warm red at the bottom.
        ink: {
          body: ["#22262e", "#15181e", "#1b1d22"], shadow: "#0c0d10",
          glow: ["rgba(240,225,200,0.16)", "rgba(240,225,200,0.05)", "rgba(240,225,200,0)"],
          rings: [[0, [246, 238, 222]], [0.7, [232, 218, 196]], [1, [226, 112, 92]]],
          core: "255,245,230",
        },
        // Bleu de France: one hue, navy body, rings from pale sky to deep blue.
        bleu: {
          body: ["#1f2d4a", "#121a2c", "#141d33"], shadow: "#0a0f1a",
          glow: ["rgba(120,165,230,0.30)", "rgba(120,165,230,0.08)", "rgba(120,165,230,0)"],
          rings: [[0, [222, 234, 250]], [0.5, [140, 178, 235]], [1, [70, 112, 200]]],
          core: "220,232,255",
        },
        // Slate and brass: green-grey body, warm amber rings.
        brass: {
          body: ["#2a302e", "#171b1a", "#1d201e"], shadow: "#0b0d0c",
          glow: ["rgba(240,190,110,0.22)", "rgba(240,190,110,0.06)", "rgba(240,190,110,0)"],
          rings: [[0, [250, 222, 170]], [0.55, [232, 180, 105]], [1, [200, 128, 70]]],
          core: "255,235,200",
        },
      };
      const P = PALETTES[new URLSearchParams(location.search).get("p")] || PALETTES.bleu;

      function squircle(x, y, w, h, r) {
        // Rounded rect with slightly "continuous" corners.
        const k = 0.62;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.bezierCurveTo(x + w - r * (1 - k), y, x + w, y + r * (1 - k), x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.bezierCurveTo(x + w, y + h - r * (1 - k), x + w - r * (1 - k), y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.bezierCurveTo(x + r * (1 - k), y + h, x, y + h - r * (1 - k), x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.bezierCurveTo(x, y + r * (1 - k), x + r * (1 - k), y, x + r, y);
        ctx.closePath();
      }

      // Drop shadow (macOS icons float slightly)
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.45)";
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 14;
      squircle(M, M, B, B, RAD);
      ctx.fillStyle = P.shadow;
      ctx.fill();
      ctx.restore();

      // Body: the app's dark glass
      ctx.save();
      squircle(M, M, B, B, RAD);
      ctx.clip();
      let g = ctx.createLinearGradient(M, M, M + B, M + B);
      g.addColorStop(0, P.body[0]);
      g.addColorStop(0.55, P.body[1]);
      g.addColorStop(1, P.body[2]);
      ctx.fillStyle = g;
      ctx.fillRect(M, M, B, B);
      // top sheen
      g = ctx.createLinearGradient(0, M, 0, M + B * 0.5);
      g.addColorStop(0, "rgba(255,255,255,0.10)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(M, M, B, B * 0.5);

      const cx = S / 2;
      const cy = S / 2 + 6;
      const R = 255;

      // Glow behind the sphere
      g = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.55);
      g.addColorStop(0, P.glow[0]);
      g.addColorStop(0.6, P.glow[1]);
      g.addColorStop(1, P.glow[2]);
      ctx.fillStyle = g;
      ctx.fillRect(M, M, B, B);

      const stops = P.rings;
      function mix(u) {
        for (let i = 1; i < stops.length; i++) {
          if (u <= stops[i][0]) {
            const [u0, a] = stops[i - 1];
            const [u1, b] = stops[i];
            const k = (u - u0) / (u1 - u0);
            return a.map((v, j) => Math.round(v + (b[j] - v) * k));
          }
        }
        return stops.at(-1)[1];
      }

      // The sphere: latitude rings with an audio wave around the equator
      const RINGS = 17;
      const SEGS = 220;
      const tilt = 0.42;
      const spin = 0.55;
      const D = 3.2;
      const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
      const cosS = Math.cos(spin), sinS = Math.sin(spin);
      const segs = [];
      for (let i = 0; i < RINGS; i++) {
        const lat = -Math.PI / 2 + ((i + 1) / (RINGS + 1)) * Math.PI;
        const cl = Math.cos(lat), sl = Math.sin(lat);
        const env = Math.pow(cl, 3);
        const pts = [];
        for (let j = 0; j <= SEGS; j++) {
          const lon = (j / SEGS) * Math.PI * 2;
          const d =
            Math.sin(4 * lon + 3 * lat + 0.6) * 0.6 +
            Math.sin(9 * lon - 5 * lat + 1.3) * 0.3 +
            Math.sin(15 * lon + 7 * lat) * 0.12;
          const r = 1 + 0.085 * d * env;
          const x0 = r * cl * Math.cos(lon), y0 = r * sl, z0 = r * cl * Math.sin(lon);
          const x1 = x0 * cosS + z0 * sinS, z1 = -x0 * sinS + z0 * cosS;
          const y2 = y0 * cosT - z1 * sinT, z2 = y0 * sinT + z1 * cosT;
          const f = D / (D - z2);
          pts.push([cx + x1 * R * f, cy - y2 * R * f, z2]);
        }
        const col = mix(1 - (sl + 1) / 2);
        for (let j = 0; j < SEGS; j++) {
          const z = (pts[j][2] + pts[j + 1][2]) / 2;
          segs.push({ a: pts[j], b: pts[j + 1], z, col });
        }
      }
      segs.sort((p, q) => p.z - q.z); // back to front
      ctx.lineCap = "round";
      for (const s of segs) {
        const front = Math.min(1, Math.max(0, (s.z + 1) / 2));
        const a = 0.1 + 0.9 * Math.pow(front, 1.5);
        ctx.strokeStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${a.toFixed(3)})`;
        ctx.lineWidth = 3 + front * 6;
        ctx.beginPath();
        ctx.moveTo(s.a[0], s.a[1]);
        ctx.lineTo(s.b[0], s.b[1]);
        ctx.stroke();
      }

      // Soft core highlight
      g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, 5, cx, cy, R);
      g.addColorStop(0, `rgba(${P.core},0.18)`);
      g.addColorStop(1, `rgba(${P.core},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Hairline edge
      squircle(M + 1, M + 1, B - 2, B - 2, RAD);
      ctx.strokeStyle = "rgba(255,255,255,0.10)";
      ctx.lineWidth = 2;
      ctx.stroke();
      document.title = "done";
    </script>
  </body>
</html>
